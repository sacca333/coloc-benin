worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml;

    upstream frontend { server frontend:3000; }
    upstream backend  { server backend:4000; }

    # Redirection HTTP → HTTPS
    server {
        listen 80;
        server_name colocbenin.bj api.colocbenin.bj;
        return 301 https://$host$request_uri;
    }

    # Frontend
    server {
        listen 443 ssl;
        server_name colocbenin.bj;

        ssl_certificate     /etc/nginx/ssl/colocbenin.crt;
        ssl_certificate_key /etc/nginx/ssl/colocbenin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 10M;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Backend API
    server {
        listen 443 ssl;
        server_name api.colocbenin.bj;

        ssl_certificate     /etc/nginx/ssl/api.colocbenin.crt;
        ssl_certificate_key /etc/nginx/ssl/api.colocbenin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 10M;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploads statiques
        location /uploads/ {
            proxy_pass http://backend/uploads/;
        }
    }
}
