version: '3.9'

services:
  # ── Base de données ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: coloc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: coloc_benin
      POSTGRES_USER: coloc_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coloc_user -d coloc_benin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coloc_net

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coloc_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://coloc_user:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/coloc_benin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:4000}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 5
      MOMO_BASE_URL: ${MOMO_BASE_URL}
      MOMO_SUBSCRIPTION_KEY: ${MOMO_SUBSCRIPTION_KEY}
      MOMO_API_USER: ${MOMO_API_USER}
      MOMO_API_KEY: ${MOMO_API_KEY}
      MOMO_TARGET_ENV: ${MOMO_TARGET_ENV:-sandbox}
      CCASH_BASE_URL: ${CCASH_BASE_URL}
      CCASH_API_KEY: ${CCASH_API_KEY}
      CCASH_MERCHANT_ID: ${CCASH_MERCHANT_ID}
      MOOV_BASE_URL: ${MOOV_BASE_URL}
      MOOV_API_KEY: ${MOOV_API_KEY}
      MOOV_MERCHANT_CODE: ${MOOV_MERCHANT_CODE}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "4000:4000"
    networks:
      - coloc_net

  # ── Frontend Next.js ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    container_name: coloc_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - "3000:3000"
    networks:
      - coloc_net

  # ── Reverse proxy Nginx (optionnel, recommandé en prod) ──────────────────────
  nginx:
    image: nginx:alpine
    container_name: coloc_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - coloc_net
    profiles:
      - prod

volumes:
  postgres_data:
  uploads_data:

networks:
  coloc_net:
    driver: bridge
